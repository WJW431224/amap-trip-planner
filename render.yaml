services:
  - type: web
    name: amap-trip-planner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      # 在 Render 控制台填这两个值，所有人都能直接用，不用自己申请 Key。
      - key: AMAP_KEY
        sync: false
      - key: AMAP_SECURITY_CODE
        sync: false
